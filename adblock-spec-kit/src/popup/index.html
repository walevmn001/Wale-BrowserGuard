<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdBlock Security</title>
  </head>
  <body>
    <main id="app">
      <h1>AdBlock Security</h1>

      <section aria-labelledby="site-heading">
        <h2 id="site-heading" data-i18n="siteHeading">Trang hiện tại</h2>
        <p id="site-domain">…</p>
        <p id="site-status">…</p>
        <button id="site-toggle" type="button" aria-pressed="false" data-i18n="siteToggleBlock">
          Chặn trên trang này
        </button>
      </section>

      <section aria-labelledby="fingerprint-heading">
        <h2 id="fingerprint-heading" data-i18n="fingerprintHeading">Chống dấu vết trình duyệt</h2>
        <label>
          <input id="fingerprint-site" type="checkbox" checked />
          <span data-i18n="fingerprintSiteLabel">Chống dấu vết trên trang này</span>
        </label>
      </section>

      <section aria-labelledby="stats-heading">
        <h2 id="stats-heading" data-i18n="statsHeading">Thống kê</h2>
        <p id="stats-site">…</p>
        <p id="stats-total">…</p>
        <button id="stats-clear" type="button" data-i18n="statsClear">Xoá thống kê</button>
      </section>

      <section aria-labelledby="master-heading">
        <h2 id="master-heading" data-i18n="masterHeading">Toàn bộ extension</h2>
        <p id="master-status">…</p>
        <button id="master-toggle" type="button">…</button>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
