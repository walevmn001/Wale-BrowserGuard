<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WALE GUARD</title>
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    body{width:384px;background:var(--bg)}
    .pop{padding:var(--s3);display:grid;gap:var(--s3)}
    .pop-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:2px 2px 0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand img{width:30px;height:30px;flex:none;border-radius:var(--radius-sm)}
    .brand .name{font-weight:750;font-size:15px;letter-spacing:-.01em}
    .brand .tag{font-size:10.5px;font-weight:650;color:var(--muted-2);letter-spacing:.02em}
    .toggle{position:relative;width:46px;height:27px;flex:none;padding:0;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--surface-3);cursor:pointer;transition:background var(--t-med) var(--ease),border-color var(--t-med) var(--ease)}
    .toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.22);transition:transform var(--t-med) var(--ease-out)}
    .toggle[aria-checked="true"]{background:var(--mint-500);border-color:var(--mint-600)}
    .toggle[aria-checked="true"]::after{transform:translateX(19px)}
    .toggle.big{width:54px;height:30px}
    .toggle.big::after{width:24px;height:24px;top:2px;left:2px}
    .toggle.big[aria-checked="true"]::after{transform:translateX(22px)}
    .guard{display:grid;gap:var(--s3);background:linear-gradient(135deg,var(--mint-50) 0%,var(--blue-50) 100%);border-color:var(--mint-100);position:relative;overflow:hidden}
    .guard::after{content:"";position:absolute;top:-30%;right:-15%;width:160px;height:160px;background:radial-gradient(circle,rgba(45,212,191,.2) 0%,transparent 70%);pointer-events:none}
    .guard .ico{width:44px;height:44px;flex:none;border-radius:var(--radius-lg);display:grid;place-items:center;background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}
    .guard .ico svg{width:24px;height:24px}
    .guard-status{font-weight:700;font-size:16px;letter-spacing:-.01em}
    .pause-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding-top:var(--s3);border-top:1px solid var(--mint-100)}
    .site-card .site-head{display:flex;align-items:center;gap:var(--s3)}
    .site-card .site-ic{width:36px;height:36px;border-radius:var(--radius);display:grid;place-items:center;background:var(--blue-50);color:var(--blue-600);flex:none}
    .site-card .site-ic svg{width:18px;height:18px}
    .site-card .site-name{font-weight:700;font-size:14px}
    .site-card .site-meta{font-size:11.5px;color:var(--muted)}
    .modules{display:grid;gap:var(--s2)}
    .mod-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);font:inherit;transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
    .mod-row:hover{border-color:var(--mint-300);background:var(--mint-50);transform:translateX(2px)}
    .mod-row .ic{width:30px;height:30px;flex:none;border-radius:var(--radius-xs);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
    .mod-row .ic.off{background:var(--surface-2);color:var(--muted-2)}
    .mod-row .nm{font-weight:600;font-size:13px}
    .mod-row .st{margin-left:auto;font-size:11px;font-weight:650;color:var(--accent)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
    .actions .span2{grid-column:1 / -1}
    .actions select.btn{appearance:none;text-align:center}
    .pop-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 2px 2px}
  </style>
</head>
<body>
  <main class="pop">
    <header class="pop-head">
      <div class="brand">
        <img src="icon.svg" alt="" width="30" height="30" />
        <div class="truncate">
          <h1 class="name">WALE GUARD</h1>
          <div class="tag">Không thu thập dữ liệu</div>
        </div>
      </div>
      <button class="icon-btn" type="button" title="Cài đặt" aria-label="Cài đặt">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </header>

    <section class="card guard">
      <div class="between">
        <div class="cluster">
          <span class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
          </span>
          <div>
            <div class="guard-status">Đang được bảo vệ</div>
            <div class="tiny muted">Extension đang bật</div>
          </div>
        </div>
        <button class="toggle big" type="button" role="switch" aria-checked="true" title="Bảo vệ toàn bộ extension"></button>
      </div>
    </section>

    <section class="card site-card">
      <div class="between">
        <div class="site-head grow">
          <span class="site-ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </span>
          <div class="grow">
            <div class="section-title">Trang hiện tại</div>
            <div class="site-name truncate">example.com</div>
            <div class="site-meta">Đang chặn trên trang này</div>
          </div>
        </div>
        <button class="toggle" type="button" aria-pressed="true" title="Bảo vệ đang bật"></button>
      </div>
      <div class="stats" style="margin-top:var(--s3)">
        <div class="stat accent"><b>12</b><span>Chặn ở trang này</span></div>
        <div class="stat"><b>15.6K</b><span>Tổng cộng</span></div>
        <div class="stat blue"><b>245</b><span>Đã chặn hôm nay</span></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Hành động nhanh</div>
      <div class="actions">
        <button class="btn ghost sm" type="button">Quét trang này</button>
        <button class="btn ghost sm" type="button">Ẩn phần tử</button>
        <button class="btn ghost sm" type="button">Xoá thống kê</button>
        <select class="btn ghost sm" aria-label="Tạm dừng bảo vệ">
          <option value="">Tạm dừng</option>
          <option value="five">5 phút</option>
          <option value="fifteen">15 phút</option>
          <option value="thirty">30 phút</option>
        </select>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Mô-đun bảo vệ</div>
      <div class="modules">
        <button class="mod-row" type="button" data-on="true">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" /></svg></span>
          <span class="nm">Chặn quảng cáo</span>
          <span class="st">Bật</span>
        </button>
        <button class="mod-row" type="button" data-on="true">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" /><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" /><path d="m2 2 20 20" /></svg></span>
          <span class="nm">Chặn theo dõi</span>
          <span class="st">Bật</span>
        </button>
        <button class="mod-row" type="button" data-on="true">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="M12 8v4M12 16h.01" /></svg></span>
          <span class="nm">Bảo vệ web</span>
          <span class="st">Bật</span>
        </button>
        <button class="mod-row" type="button" data-on="false">
          <span class="ic off"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 11V7a6 6 0 0 1 12 0v4" /><path d="M5 11h14v9H5z" /></svg></span>
          <span class="nm">Nâng cấp HTTPS</span>
          <span class="st" style="color:var(--muted)">Tắt</span>
        </button>
      </div>
    </section>

    <footer class="pop-foot">
      <button class="btn link" type="button">Nhật ký hoạt động</button>
      <button class="btn link" type="button">Mở bảng điều khiển</button>
    </footer>
  </main>
</body>
</html>
